<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Insurance Chatbot</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background: #111827;
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 16px 40px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      header span {
        font-size: 36px;
      }

      header h1 {
        font-size: 28px;
        font-weight: 700;
        color: #fff;
      }

      .chat-box {
        width: 100%;
        max-width: 560px;
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        min-height: 420px;
        max-height: 560px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scroll-behavior: smooth;
      }

      .chat-box::-webkit-scrollbar {
        width: 4px;
      }
      .chat-box::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 4px;
      }

      /* Bot message */
      .msg-bot {
        display: flex;
        align-items: flex-start;
        gap: 0;
      }

      .bot-bubble {
        background: #f3f4f6;
        color: #111827;
        border-radius: 18px 18px 18px 4px;
        padding: 12px 16px;
        font-size: 15px;
        max-width: 80%;
        line-height: 1.5;
      }

      /* User message */
      .msg-user {
        display: flex;
        justify-content: flex-end;
      }

      .user-bubble {
        background: #2563eb;
        color: #fff;
        border-radius: 18px 18px 4px 18px;
        padding: 12px 18px;
        font-size: 15px;
        max-width: 60%;
        line-height: 1.5;
        font-weight: 500;
      }

      /* Typing dots */
      .typing-bubble {
        background: #f3f4f6;
        border-radius: 18px 18px 18px 4px;
        padding: 14px 18px;
        display: flex;
        gap: 5px;
        align-items: center;
        width: fit-content;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #9ca3af;
        animation: blink 1.3s infinite both;
      }
      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.85);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Recommendation card */
      .rec-bubble {
        background: #f0f9ff;
        border: 1px solid #bae6fd;
        border-radius: 16px;
        padding: 16px;
        max-width: 90%;
        font-size: 14px;
        color: #0f172a;
      }

      .rec-title {
        font-weight: 600;
        font-size: 13px;
        color: #0369a1;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 10px;
      }

      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 14px;
      }

      .pill {
        background: #dbeafe;
        border: 1px solid #93c5fd;
        border-radius: 20px;
        padding: 4px 12px;
        font-size: 12px;
        color: #1d4ed8;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .pill::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #10b981;
      }

      .why-title {
        font-weight: 600;
        font-size: 13px;
        color: #6d28d9;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 6px;
      }

      .why-text {
        font-size: 13px;
        color: #374151;
        line-height: 1.6;
        border-left: 3px solid #8b5cf6;
        padding-left: 10px;
      }

      /* Input area */
      .input-row {
        display: flex;
        gap: 10px;
        width: 100%;
        max-width: 560px;
        margin-top: 16px;
      }

      input[type="text"] {
        flex: 1;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 12px;
        color: #fff;
        font-family: "Inter", sans-serif;
        font-size: 15px;
        padding: 13px 18px;
        outline: none;
        transition: border-color 0.2s;
      }

      input::placeholder {
        color: #6b7280;
      }
      input:focus {
        border-color: #3b82f6;
      }

      .send-btn {
        background: #2563eb;
        border: none;
        border-radius: 12px;
        color: #fff;
        font-family: "Inter", sans-serif;
        font-size: 15px;
        font-weight: 500;
        padding: 13px 24px;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
        white-space: nowrap;
      }

      .send-btn:hover {
        background: #1d4ed8;
      }
      .send-btn:active {
        transform: scale(0.97);
      }
      .send-btn:disabled {
        background: #374151;
        color: #6b7280;
        cursor: not-allowed;
      }

      .new-chat-btn {
        margin-top: 12px;
        background: transparent;
        border: 1px solid #374151;
        border-radius: 10px;
        color: #9ca3af;
        font-family: "Inter", sans-serif;
        font-size: 13px;
        padding: 8px 20px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .new-chat-btn:hover {
        border-color: #3b82f6;
        color: #60a5fa;
      }
    </style>
  </head>
  <body>
    <header>
      <span>✈️</span>
      <h1>Travel Insurance Chatbot</h1>
    </header>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-row">
      <input type="text" id="userInput" placeholder="Type your message..." />
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        Send
      </button>
    </div>

    <button class="new-chat-btn" onclick="resetChat()">+ New Chat</button>

    <script>
      const API = "https://travel-insurance-recommender.onrender.com";
      let history = [];
      let isLoading = false;

      const chatBox = document.getElementById("chatBox");
      const inputEl = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");

      const QUESTION_EMOJIS = {
        destination: "🌍",
        cost: "💰",
        days: "📅",
        age: "🎂",
        medical: "🏥",
        default: "💬",
      };

      function getEmoji(text) {
        const t = text.toLowerCase();
        if (
          t.includes("destination") ||
          t.includes("where") ||
          t.includes("travel")
        )
          return "🌍";
        if (
          t.includes("cost") ||
          t.includes("budget") ||
          t.includes("worth") ||
          t.includes("₹")
        )
          return "💰";
        if (t.includes("days") || t.includes("duration") || t.includes("long"))
          return "📅";
        if (t.includes("age") || t.includes("old") || t.includes("born"))
          return "🎂";
        if (
          t.includes("medical") ||
          t.includes("condition") ||
          t.includes("health")
        )
          return "🏥";
        if (t.includes("error") || t.includes("❌")) return "❌";
        if (
          t.includes("great") ||
          t.includes("perfect") ||
          t.includes("thanks") ||
          t.includes("hello") ||
          t.includes("hi")
        )
          return "👋";
        return "💬";
      }

      function scrollBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function addBotMessage(text) {
        const wrap = document.createElement("div");
        wrap.className = "msg-bot";

        const bub = document.createElement("div");
        bub.className = "bot-bubble";
        const emoji = getEmoji(text);
        bub.textContent = `${emoji} ${text}`;

        wrap.appendChild(bub);
        chatBox.appendChild(wrap);
        scrollBottom();
      }

      function addUserMessage(text) {
        const wrap = document.createElement("div");
        wrap.className = "msg-user";

        const bub = document.createElement("div");
        bub.className = "user-bubble";
        bub.textContent = text;

        wrap.appendChild(bub);
        chatBox.appendChild(wrap);
        scrollBottom();
      }

      function addRecommendation(raw) {
        const coverageMatch = raw.match(
          /📋 Recommended Coverage:\n([\s\S]*?)\n\n💡/,
        );
        const coverages = coverageMatch
          ? coverageMatch[1]
              .split("\n")
              .map((l) => l.replace("• ", "").trim())
              .filter(Boolean)
          : [];

        const explanationMatch = raw.match(
          /💡 Why These Coverages:\n([\s\S]*)/,
        );
        const explanation = explanationMatch ? explanationMatch[1].trim() : raw;

        const pills = coverages
          .map((c) => `<div class="pill">${c}</div>`)
          .join("");

        const wrap = document.createElement("div");
        wrap.className = "msg-bot";

        const bub = document.createElement("div");
        bub.className = "rec-bubble";
        bub.innerHTML = `
      <div class="rec-title">📋 Recommended Coverage</div>
      <div class="pills">${pills}</div>
      <div class="why-title">💡 Why These Coverages</div>
      <div class="why-text">${explanation}</div>
    `;

        wrap.appendChild(bub);
        chatBox.appendChild(wrap);
        scrollBottom();
      }

      function addTyping() {
        const wrap = document.createElement("div");
        wrap.className = "msg-bot";
        wrap.id = "typing";

        const bub = document.createElement("div");
        bub.className = "typing-bubble";
        bub.innerHTML =
          '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

        wrap.appendChild(bub);
        chatBox.appendChild(wrap);
        scrollBottom();
      }

      function removeTyping() {
        const t = document.getElementById("typing");
        if (t) t.remove();
      }

      async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text || isLoading) return;

        inputEl.value = "";
        isLoading = true;
        sendBtn.disabled = true;

        addUserMessage(text);
        history.push({ role: "user", content: text });
        addTyping();

        try {
          const res = await fetch(`${API}/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: history }),
          });

          const data = await res.json();
          removeTyping();

          history.push({ role: "assistant", content: data.reply });

          if (data.done) {
            addRecommendation(data.reply);
          } else {
            addBotMessage(data.reply);
          }
        } catch (err) {
          removeTyping();
          addBotMessage(
            "❌ Error getting recommendation. Make sure the backend is running.",
          );
        }

        isLoading = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }

      async function startChat() {
        isLoading = true;
        sendBtn.disabled = true;
        addTyping();

        try {
          const res = await fetch(`${API}/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: [] }),
          });
          const data = await res.json();
          removeTyping();
          history.push({ role: "assistant", content: data.reply });
          addBotMessage(data.reply);
        } catch {
          removeTyping();
          addBotMessage(
            "👋 Hi! I'm your travel insurance advisor. Where are you planning to travel?",
          );
        }

        isLoading = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }

      function resetChat() {
        history = [];
        chatBox.innerHTML = "";
        startChat();
      }

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
      });

      startChat();
    </script>
  </body>
</html>
