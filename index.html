<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Insurance Recommender</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0f1724;
        --surface: #19253a;
        --surface2: #1f2e45;
        --border: rgba(255, 255, 255, 0.08);
        --accent: #3b82f6;
        --accent-light: #60a5fa;
        --text: #f0f4ff;
        --text-secondary: #8fa3c0;
        --success: #10b981;
        --error: #f87171;
        --radius: 14px;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 16px 60px;
      }

      header {
        text-align: center;
        margin-bottom: 40px;
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.12em;
        color: var(--accent-light);
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      header h1 {
        font-family: "Playfair Display", serif;
        font-size: clamp(28px, 5vw, 44px);
        font-weight: 700;
        line-height: 1.2;
        color: var(--text);
      }

      header p {
        margin-top: 10px;
        color: var(--text-secondary);
        font-size: 15px;
        max-width: 460px;
        margin-inline: auto;
        line-height: 1.6;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 32px;
        width: 100%;
        max-width: 560px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-group.full {
        grid-column: 1 / -1;
      }

      label {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
        letter-spacing: 0.04em;
      }

      input,
      select {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: "Inter", sans-serif;
        font-size: 14px;
        padding: 10px 14px;
        outline: none;
        transition: border-color 0.2s;
        width: 100%;
      }

      input::placeholder {
        color: var(--text-secondary);
      }

      input:focus,
      select:focus {
        border-color: var(--accent);
      }

      select option {
        background: var(--surface2);
      }

      .submit-btn {
        margin-top: 24px;
        width: 100%;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-family: "Inter", sans-serif;
        font-size: 15px;
        font-weight: 500;
        padding: 13px;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .submit-btn:hover {
        background: #2563eb;
      }
      .submit-btn:active {
        transform: scale(0.98);
      }
      .submit-btn:disabled {
        background: #2d3f5a;
        color: var(--text-secondary);
        cursor: not-allowed;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .result-card {
        margin-top: 24px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        display: none;
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .result-card.visible {
        display: block;
      }

      .result-section {
        margin-bottom: 20px;
      }
      .result-section:last-child {
        margin-bottom: 0;
      }

      .result-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        color: var(--accent-light);
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .coverage-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .coverage-pill {
        background: rgba(59, 130, 246, 0.12);
        border: 1px solid rgba(59, 130, 246, 0.25);
        border-radius: 20px;
        padding: 5px 13px;
        font-size: 13px;
        color: var(--accent-light);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .coverage-pill::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
        flex-shrink: 0;
      }

      .explanation {
        font-size: 14px;
        line-height: 1.7;
        color: var(--text-secondary);
        border-left: 3px solid var(--accent);
        padding-left: 14px;
      }

      .error-box {
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.3);
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 13px;
        color: var(--error);
        margin-top: 16px;
        display: none;
      }
      .error-box.visible {
        display: block;
      }

      .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 20px 0;
      }

      @media (max-width: 480px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
        .form-group.full {
          grid-column: 1;
        }
        .card {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <p class="eyebrow">AI-Powered</p>
      <h1>Travel Insurance Recommender</h1>
      <p>
        Tell us about your trip and we'll recommend the right coverage for you.
      </p>
    </header>

    <div class="card">
      <div class="form-grid">
        <div class="form-group full">
          <label for="destination">Destination</label>
          <input
            type="text"
            id="destination"
            placeholder="e.g. USA, Dubai, Goa"
          />
        </div>

        <div class="form-group">
          <label for="trip_cost">Trip Cost (₹)</label>
          <input
            type="number"
            id="trip_cost"
            placeholder="e.g. 150000"
            min="1"
          />
        </div>

        <div class="form-group">
          <label for="duration">Duration (days)</label>
          <input type="number" id="duration" placeholder="e.g. 14" min="1" />
        </div>

        <div class="form-group">
          <label for="age">Your Age</label>
          <input
            type="number"
            id="age"
            placeholder="e.g. 35"
            min="1"
            max="120"
          />
        </div>

        <div class="form-group">
          <label for="medical_condition">Medical Condition</label>
          <select id="medical_condition">
            <option value="none">None</option>
            <option value="diabetes">Diabetes</option>
            <option value="heart condition">Heart Condition</option>
            <option value="hypertension">Hypertension</option>
            <option value="asthma">Asthma</option>
            <option value="cancer">Cancer</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="error-box" id="errorBox"></div>

      <button class="submit-btn" id="submitBtn" onclick="getRecommendation()">
        <div class="spinner" id="spinner"></div>
        <span id="btnText">Get Recommendation</span>
      </button>

      <div class="result-card" id="resultCard">
        <div class="result-section">
          <div class="result-label">Recommended Coverage</div>
          <div class="coverage-list" id="coverageList"></div>
        </div>
        <hr class="divider" />
        <div class="result-section">
          <div class="result-label">Why these coverages</div>
          <p class="explanation" id="explanationText"></p>
        </div>
      </div>
    </div>

    <script>
      async function getRecommendation() {
        const destination = document.getElementById("destination").value.trim();
        const trip_cost = parseInt(document.getElementById("trip_cost").value);
        const duration = parseInt(document.getElementById("duration").value);
        const age = parseInt(document.getElementById("age").value);
        const medical_condition =
          document.getElementById("medical_condition").value;

        const errorBox = document.getElementById("errorBox");
        errorBox.classList.remove("visible");

        if (!destination || !trip_cost || !duration || !age) {
          errorBox.textContent = "Please fill in all fields before submitting.";
          errorBox.classList.add("visible");
          return;
        }

        const btn = document.getElementById("submitBtn");
        const spinner = document.getElementById("spinner");
        const btnText = document.getElementById("btnText");

        btn.disabled = true;
        spinner.style.display = "block";
        btnText.textContent = "Analysing your trip…";

        document.getElementById("resultCard").classList.remove("visible");

        try {
          const res = await fetch("http://127.0.0.1:8000/recommend", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              destination,
              trip_cost,
              duration,
              age,
              medical_condition,
            }),
          });

          const data = await res.json();

          if (data.error) {
            errorBox.textContent = Array.isArray(data.error)
              ? data.error.join(", ")
              : data.error;
            errorBox.classList.add("visible");
            return;
          }

          const raw = data.recommendation;

          // Parse coverages
          const coverageMatch = raw.match(
            /📋 Recommended Coverage:\n([\s\S]*?)\n\n💡/,
          );
          const coverages = coverageMatch
            ? coverageMatch[1]
                .split("\n")
                .map((l) => l.replace("• ", "").trim())
                .filter(Boolean)
            : [];

          // Parse explanation
          const explanationMatch = raw.match(
            /💡 Why These Coverages:\n([\s\S]*)/,
          );
          const explanation = explanationMatch
            ? explanationMatch[1].trim()
            : "";

          // Render coverages as pills
          const coverageList = document.getElementById("coverageList");
          coverageList.innerHTML = coverages
            .map((c) => `<div class="coverage-pill">${c}</div>`)
            .join("");

          document.getElementById("explanationText").textContent = explanation;
          document.getElementById("resultCard").classList.add("visible");
        } catch (err) {
          errorBox.textContent =
            "Could not connect to the server. Make sure your backend is running on http://127.0.0.1:8000";
          errorBox.classList.add("visible");
        } finally {
          btn.disabled = false;
          spinner.style.display = "none";
          btnText.textContent = "Get Recommendation";
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") getRecommendation();
      });
    </script>
  </body>
</html>
